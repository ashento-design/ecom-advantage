<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Launchory</title>
<style>
  :root {
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  html, body {
    overflow: hidden;
  }
  body {
    margin: 0;
    width: 320px;
    background: #0F172A;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #e5e7eb;
  }
  .header {
    padding: 18px 18px 16px;
  }
  .header-top {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .logo {
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: linear-gradient(135deg, #6366f1, #4f46e5);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: 0 4px 14px rgba(79, 70, 229, 0.35);
  }
  .brand-block {
    min-width: 0;
  }
  .brand {
    font-weight: 700;
    font-size: 16px;
    color: #ffffff;
    line-height: 1.2;
  }
  .subbrand {
    font-size: 12px;
    color: #94a3b8;
    margin-top: 1px;
  }
  .divider {
    height: 1px;
    background: #1e293b;
  }
  .content {
    padding: 18px;
    min-height: 76px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: #818cf8;
    margin: 0 0 8px 0;
  }
  .product-title {
    font-size: 14px;
    font-weight: 500;
    color: #ffffff;
    line-height: 1.4;
    margin: 0 0 16px 0;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .empty-state {
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.55;
    margin: 0 0 16px 0;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 13.5px;
    font-weight: 600;
    text-decoration: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    transition: background 150ms ease, transform 150ms ease;
  }
  .btn:active {
    transform: scale(0.98);
  }
  .btn-primary {
    background: #4F46E5;
    color: #ffffff;
  }
  .btn-primary:hover {
    background: #6366F1;
  }
  .btn-secondary {
    background: #1e293b;
    color: #e5e7eb;
    border: 1px solid #334155;
    margin-top: 8px;
  }
  .btn-secondary:hover {
    background: #263449;
  }
  .powered-by {
    font-size: 11px;
    color: #64748b;
    text-align: center;
    margin: 12px 0 0 0;
  }
  .dashboard-link {
    display: block;
    text-align: center;
    font-size: 12.5px;
    color: #94a3b8;
    text-decoration: none;
    padding: 9px;
    border-radius: 8px;
    margin-top: 8px;
    transition: background 150ms ease, color 150ms ease;
  }
  .dashboard-link:hover {
    background: #1e293b;
    color: #ffffff;
  }
  .footer {
    padding: 12px 18px 16px;
    text-align: center;
    font-size: 11px;
    color: #475569;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
  <div class="header">
    <div class="header-top">
      <div class="logo">🚀</div>
      <div class="brand-block">
        <div class="brand">Launchory</div>
        <div class="subbrand">AI Product Research</div>
      </div>
    </div>
  </div>

  <div class="divider"></div>

  <div class="content" id="content">
    <p class="empty-state">Loading…</p>
  </div>

  <div class="footer">launchory.io</div>

  <script src="popup.js"></script>
</body>
</html>
